# @package _global_

domain_rand:
  # push robots
  push_robots : False
  push_interval_s : [5, 10]
  max_push_vel_xy : 1.0

  # base com
  randomize_base_com : True
  base_com_range: #kg
    x : [-0.1, 0.1]
    y : [-0.1, 0.1]
    z : [-0.01, 0.01]

  # link mass
  randomize_link_mass : True
  link_mass_range : [0.8, 1.2] # *factor 0.8,1.2
  # randomize_link_body_names : [
  #     'pelvis', 'torso_link', 'left_hip_yaw_link', 'left_hip_roll_link', 'left_hip_pitch_link', 'left_knee_link', #'left_shoulder_pitch_link','left_wrist_roll_link','left_elbow_link',
  #     'right_hip_yaw_link', 'right_hip_roll_link', 'right_hip_pitch_link', 'right_knee_link' #,'right_shoulder_pitch_link','right_wrist_roll_link','right_elbow_link'
  # ]
  randomize_link_body_names: ['pelvis', 
                'left_hip_pitch_link', 'left_hip_roll_link', 'left_hip_yaw_link', 'left_knee_link', 'left_ankle_pitch_link', 'left_ankle_roll_link',
                'right_hip_pitch_link', 'right_hip_roll_link', 'right_hip_yaw_link', 'right_knee_link', 'right_ankle_pitch_link', 'right_ankle_roll_link',
                'waist_yaw_link', 'waist_roll_link', 'torso_link',
                'left_shoulder_pitch_link', 'left_shoulder_roll_link', 'left_shoulder_yaw_link', 'left_elbow_link', 'left_wrist_roll_link', 'left_wrist_pitch_link', 'left_wrist_yaw_link',  
                'right_shoulder_pitch_link', 'right_shoulder_roll_link', 'right_shoulder_yaw_link', 'right_elbow_link', 'right_wrist_roll_link', 'right_wrist_pitch_link', 'right_wrist_yaw_link']

  # obj mass
  randomize_obj_mass : True
  obj_mass_range : [0.8, 1.2]

  # pd gain
  randomize_pd_gain : True
  kp_range : [0.8, 1.2]
  kd_range : [0.8, 1.2]

  # friction
  randomize_friction : True
  friction_range : [0.5, 1.25]

  # obj friction
  randomize_obj_friction : True
  obj_friction_range : [0.5, 1.25]

  # base mass
  randomize_base_mass : False

  # rfi
  randomize_torque_rfi : True
  rfi_lim : 0.1
  randomize_rfi_lim : True
  rfi_lim_range : [0.5, 1.5]


  # control delay
  randomize_ctrl_delay : True
  ctrl_delay_step_range : [0, 2] # integer max real delay is 90ms